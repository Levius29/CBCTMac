<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>OpenMRI Dental</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #0a0a0b; color: #e7e7ea;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .08em; margin: 0 0 .5rem; }
      p { color: #a1a1aa; margin: .25rem 0; }
      .spinner {
        width: 28px; height: 28px; margin: 1.25rem auto; border-radius: 50%;
        border: 2px solid #27272a; border-top-color: #e7e7ea; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { color: #fca5a5; text-align: left; white-space: pre-wrap; }
      code { color: #e7e7ea; word-break: break-all; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>OPENMRI DENTAL</h1>
      <div id="waiting">
        <div class="spinner"></div>
        <p>Starting the local engine…</p>
        <p>Nothing leaves this computer.</p>
      </div>
      <div id="failed" hidden>
        <p class="error" id="message"></p>
        <p>The log is in <code id="log"></code></p>
        <p>Menu File → Show Engine Log opens it.</p>
      </div>
    </main>
    <script>
      // Pagina d'attesa e pagina d'errore insieme: la differenza la fa l'indirizzo.
      const query = new URLSearchParams(location.search);
      if (query.get('error')) {
        document.getElementById('waiting').hidden = true;
        document.getElementById('failed').hidden = false;
        document.getElementById('message').textContent = query.get('error');
        document.getElementById('log').textContent = query.get('log') || '';
      }
    </script>
  </body>
</html>
